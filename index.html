const OFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l4 6M21 9l-4 6"/></svg>';
const ON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const icon='<svg class="wa" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><use href="#wa"/></svg>';
const wa=m=>'https://wa.me/'+PHONE+'?text='+encodeURIComponent(m);
const strip=document.getElementById('strip');
let L='tr';

strip.innerHTML=FILES.map(f=>`<div class="card"><div class="v"><video src="${f}.mp4" poster="${f}.jpg" muted loop playsinline preload="metadata"></video><button class="snd"></button></div><h3></h3><p></p></div>`).join('');

function sndBtn(b){const v=b.parentElement.querySelector('video');b.innerHTML=v.muted?OFF:ON;b.setAttribute('aria-label',T[L].snd[v.muted?0:1])}

function render(l){
 L=T[l]?l:'tr';const t=T[L],rtl=L==='ar';
 document.documentElement.lang=L;document.documentElement.dir=rtl?'rtl':'ltr';document.title=t.title;
 for(const e of document.querySelectorAll('[data-t]'))e.textContent=t[e.dataset.t];
 for(const b of document.querySelectorAll('.lang button'))b.setAttribute('aria-pressed',b.dataset.l===L);
 strip.querySelectorAll('.card').forEach((c,i)=>{c.querySelector('h3').textContent=t.work[i][0];c.querySelector('p').textContent=t.work[i][1]});
 document.getElementById('steps').innerHTML=t.steps.map((s,i)=>`<div class="step"><i>${i+1}</i><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join('');
 document.getElementById('packs').innerHTML=t.packs.map((k,i)=>{const on=i===1;
  const price=k[1]?`<div class="price">${k[1]} <small>${k[2]}</small></div>`:`<div class="price ask">${t.priceAsk}</div>`;
  return `<div class="pack${on?' on':''}">${on?`<span class="badge">${t.badge}</span>`:''}<h3>${k[0]}</h3>${price}<ul>${k[3].map(x=>`<li>${x}</li>`).join('')}</ul><a class="${on?'btn':'ghost'} wa-link" data-pack="${k[0]}" href="#">${on?icon:''}${t.askPack}</a></div>`}).join('');
 for(const a of document.querySelectorAll('.wa-link')){a.href=wa(a.dataset.pack?t.m.pack(a.dataset.pack):t.m[a.dataset.m]);a.target='_blank';a.rel='noopener'}
 const [p,n]=document.querySelectorAll('.navb');
 p.textContent=rtl?'→':'←';n.textContent=rtl?'←':'→';p.setAttribute('aria-label',t.prev);n.setAttribute('aria-label',t.next);
 for(const b of document.querySelectorAll('.snd'))sndBtn(b);
 try{localStorage.setItem('lang',L)}catch(e){}
 const u=new URL(location.href);if(u.searchParams.get('lang')!==L){u.searchParams.set('lang',L);history.replaceState(null,'',u)}
}

for(const b of document.querySelectorAll('.lang button'))b.addEventListener('click',()=>render(b.dataset.l));
for(const b of document.querySelectorAll('.snd'))b.addEventListener('click',()=>{const v=b.parentElement.querySelector('video');v.muted=!v.muted;sndBtn(b);if(!v.muted)v.play().catch(()=>{})});
const io=new IntersectionObserver(es=>{for(const e of es){if(e.isIntersecting)e.target.play().catch(()=>{});else e.target.pause()}},{threshold:.4});
for(const v of strip.querySelectorAll('video'))io.observe(v);
const go=d=>{const c=strip.querySelector('.card');const s=document.documentElement.dir==='rtl'?-1:1;strip.scrollBy({left:s*d*((c?c.offsetWidth:240)+16),behavior:'smooth'})};
for(const b of document.querySelectorAll('.navb'))b.addEventListener('click',()=>go(+b.dataset.d));
strip.addEventListener('keydown',e=>{const s=document.documentElement.dir==='rtl'?-1:1;if(e.key==='ArrowRight')go(s);if(e.key==='ArrowLeft')go(-s)});

let start=new URLSearchParams(location.search).get('lang');
if(!T[start]){try{start=localStorage.getItem('lang')}catch(e){}}
if(!T[start]){const n=(navigator.language||'').slice(0,2);start=n==='ar'?'ar':n==='tr'?'tr':'en'}
render(start);
}
</script>
</body>
</html>
